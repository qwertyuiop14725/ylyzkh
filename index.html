<!DOCTYPE html>
<html lang="zh-CN" class="boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#05070f">
<title>LLH 加密保护</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#05070f;}
html.boot body{opacity:0;}
body{color:#e9eefb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-transition:opacity .22s ease;transition:opacity .22s ease;}
.bg{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;z-index:0;background:#05070f;}
.orb{position:absolute;border-radius:50%;}
.orb1{width:78vw;height:78vw;max-width:540px;max-height:540px;left:-20vw;top:-16vh;background:#1a2650;background:-webkit-radial-gradient(circle at 50% 50%,rgba(70,110,255,.55),rgba(70,110,255,0) 68%);background:radial-gradient(circle at 50% 50%,rgba(70,110,255,.55),rgba(70,110,255,0) 68%);-webkit-animation:drift1 16s ease-in-out infinite;animation:drift1 16s ease-in-out infinite;}
.orb2{width:68vw;height:68vw;max-width:480px;max-height:480px;right:-18vw;top:20vh;background:#201a48;background:-webkit-radial-gradient(circle at 50% 50%,rgba(150,80,255,.45),rgba(150,80,255,0) 68%);background:radial-gradient(circle at 50% 50%,rgba(150,80,255,.45),rgba(150,80,255,0) 68%);-webkit-animation:drift2 21s ease-in-out infinite;animation:drift2 21s ease-in-out infinite;}
.orb3{width:86vw;height:86vw;max-width:620px;max-height:620px;left:6vw;bottom:-32vh;background:#0c2840;background:-webkit-radial-gradient(circle at 50% 50%,rgba(0,200,255,.26),rgba(0,200,255,0) 68%);background:radial-gradient(circle at 50% 50%,rgba(0,200,255,.26),rgba(0,200,255,0) 68%);-webkit-animation:drift3 25s ease-in-out infinite;animation:drift3 25s ease-in-out infinite;}
.vignette{position:absolute;left:0;top:0;width:100%;height:100%;background:-webkit-radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 28%,rgba(0,0,0,.6) 100%);background:radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 28%,rgba(0,0,0,.6) 100%);}
@-webkit-keyframes drift1{0%,100%{-webkit-transform:translate3d(0,0,0) scale(1);}50%{-webkit-transform:translate3d(6vw,5vh,0) scale(1.13);}}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(6vw,5vh,0) scale(1.13);}}
@-webkit-keyframes drift2{0%,100%{-webkit-transform:translate3d(0,0,0) scale(1.06);}50%{-webkit-transform:translate3d(-7vw,-4vh,0) scale(.92);}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1.06);}50%{transform:translate3d(-7vw,-4vh,0) scale(.92);}}
@-webkit-keyframes drift3{0%,100%{-webkit-transform:translate3d(0,0,0) scale(1);}50%{-webkit-transform:translate3d(-5vw,-6vh,0) scale(1.1);}}
@keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(-5vw,-6vh,0) scale(1.1);}}
.wrap{position:fixed;left:0;top:0;width:100%;height:100%;z-index:2;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;padding:0 22px;}
.shakeBox{width:100%;max-width:390px;}
.shake{-webkit-animation:shake .55s cubic-bezier(.36,.07,.19,.97) both;animation:shake .55s cubic-bezier(.36,.07,.19,.97) both;}
@-webkit-keyframes shake{10%,90%{-webkit-transform:translate3d(-3px,0,0);}20%,80%{-webkit-transform:translate3d(5px,0,0);}30%,50%,70%{-webkit-transform:translate3d(-7px,0,0);}40%,60%{-webkit-transform:translate3d(7px,0,0);}}
@keyframes shake{10%,90%{transform:translate3d(-3px,0,0);}20%,80%{transform:translate3d(5px,0,0);}30%,50%,70%{transform:translate3d(-7px,0,0);}40%,60%{transform:translate3d(7px,0,0);}}
.card{position:relative;width:100%;padding:38px 26px 22px;border-radius:24px;text-align:center;background:rgba(16,22,40,.86);border:1px solid rgba(120,160,255,.16);-webkit-box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);-webkit-animation:cardIn .75s cubic-bezier(.16,.9,.3,1) both;animation:cardIn .75s cubic-bezier(.16,.9,.3,1) both;}
.card:before{content:'';position:absolute;left:0;right:0;top:0;height:2px;border-radius:24px 24px 0 0;background:#6a5bff;background:-webkit-linear-gradient(left,#3f6cff,#8a4dff);background:linear-gradient(90deg,#3f6cff,#8a4dff);opacity:.85;}
@-webkit-keyframes cardIn{from{opacity:0;-webkit-transform:translate3d(0,28px,0) scale(.96);}to{opacity:1;-webkit-transform:translate3d(0,0,0) scale(1);}}
@keyframes cardIn{from{opacity:0;transform:translate3d(0,28px,0) scale(.96);}to{opacity:1;transform:translate3d(0,0,0) scale(1);}}
.cornerMark{position:absolute;top:14px;right:14px;font-size:9px;font-weight:800;letter-spacing:1.5px;color:#5b8cff;padding:3px 7px;border-radius:6px;border:1px solid rgba(90,140,255,.28);background:rgba(90,140,255,.06);opacity:.72;pointer-events:none;}
.lockWrap{position:relative;width:68px;height:68px;margin:0 auto 18px;border-radius:50%;background:rgba(90,140,255,.16);background:-webkit-linear-gradient(top,rgba(90,140,255,.24),rgba(140,90,255,.10));background:linear-gradient(180deg,rgba(90,140,255,.24),rgba(140,90,255,.10));border:1px solid rgba(120,160,255,.3);display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-box-shadow:0 0 24px rgba(90,140,255,.22),inset 0 1px 0 rgba(255,255,255,.08);box-shadow:0 0 24px rgba(90,140,255,.22),inset 0 1px 0 rgba(255,255,255,.08);}
.lockWrap:after{content:'';position:absolute;left:-6px;top:-6px;right:-6px;bottom:-6px;border-radius:50%;border:1px solid rgba(110,150,255,.4);-webkit-animation:pulse 2.6s ease-out infinite;animation:pulse 2.6s ease-out infinite;}
@-webkit-keyframes pulse{0%{-webkit-transform:scale(.88);opacity:.9;}70%{-webkit-transform:scale(1.28);opacity:0;}100%{opacity:0;}}
@keyframes pulse{0%{transform:scale(.88);opacity:.9;}70%{transform:scale(1.28);opacity:0;}100%{opacity:0;}}
.llhMonogram{font-size:15px;font-weight:800;letter-spacing:.5px;color:#a9c3ff;background:-webkit-linear-gradient(180deg,#dbe7ff,#7fa5ff);background:linear-gradient(180deg,#dbe7ff,#7fa5ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.title{font-size:21px;font-weight:700;letter-spacing:3px;color:#a9c3ff;background:-webkit-linear-gradient(left,#8fb2ff,#c9a0ff);background:linear-gradient(90deg,#8fb2ff,#c9a0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.sub{margin-top:10px;font-size:12px;line-height:1.7;color:#7f8db0;letter-spacing:.3px;}
.field{position:relative;margin-top:24px;}
.field input{width:100%;height:52px;line-height:normal;padding:0 16px;border-radius:14px;border:1px solid rgba(110,150,255,.2);background:rgba(8,12,24,.8);color:#eaf1ff;font-size:15px;letter-spacing:1px;outline:none;-webkit-appearance:none;appearance:none;-webkit-transition:border-color .3s,box-shadow .3s;transition:border-color .3s,box-shadow .3s;}
.field input::-webkit-input-placeholder{color:#5d6a8a;letter-spacing:0;}
.field input::placeholder{color:#5d6a8a;letter-spacing:0;}
.field input:focus{border-color:rgba(100,150,255,.8);box-shadow:0 0 0 4px rgba(80,130,255,.13);}
.field.err input{border-color:rgba(255,90,110,.85);box-shadow:0 0 0 4px rgba(255,80,100,.12);}
.msg{height:18px;margin-top:10px;font-size:12.5px;color:#ff6b81;letter-spacing:.5px;opacity:0;-webkit-transition:opacity .25s;transition:opacity .25s;}
.msg.on{opacity:1;}
.btn{position:relative;overflow:hidden;width:100%;height:52px;margin-top:6px;border:0;border-radius:14px;color:#fff;font-size:15px;font-weight:600;letter-spacing:3px;background:#5c5bff;background:-webkit-linear-gradient(left,#3f6cff,#8a4dff);background:linear-gradient(90deg,#3f6cff,#8a4dff);-webkit-appearance:none;appearance:none;box-shadow:0 12px 30px rgba(70,110,255,.32);-webkit-transition:-webkit-transform .16s,box-shadow .25s,opacity .25s;transition:transform .16s,box-shadow .25s,opacity .25s;cursor:pointer;}
.btn:before{content:'';position:absolute;left:-45%;top:0;width:45%;height:100%;background:-webkit-linear-gradient(left,rgba(255,255,255,0),rgba(255,255,255,.38),rgba(255,255,255,0));background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.38),rgba(255,255,255,0));-webkit-transform:skewX(-20deg);transform:skewX(-20deg);-webkit-animation:sheen 3.4s ease-in-out infinite;animation:sheen 3.4s ease-in-out infinite;}
@-webkit-keyframes sheen{0%{left:-45%;}55%{left:125%;}100%{left:125%;}}
@keyframes sheen{0%{left:-45%;}55%{left:125%;}100%{left:125%;}}
.btn:active{-webkit-transform:scale(.972);transform:scale(.972);box-shadow:0 6px 16px rgba(70,110,255,.26);}
.btn.busy{opacity:.86;pointer-events:none;}
.spinner{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:8px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;-webkit-animation:spin .65s linear infinite;animation:spin .65s linear infinite;}
@-webkit-keyframes spin{from{-webkit-transform:rotate(0);}to{-webkit-transform:rotate(360deg);}}
@keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
.badge{margin-top:22px;padding-top:15px;border-top:1px solid rgba(120,160,255,.1);font-size:11.5px;color:#61708f;letter-spacing:.8px;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;}
.badge .dot{width:6px;height:6px;border-radius:50%;margin-right:7px;background:#3ddc97;box-shadow:0 0 8px #3ddc97;-webkit-animation:blink 2s ease-in-out infinite;animation:blink 2s ease-in-out infinite;-webkit-flex-shrink:0;flex-shrink:0;}
.badge b{color:#8fb2ff;font-weight:800;margin:0 3px;letter-spacing:1px;background:-webkit-linear-gradient(left,#8fb2ff,#c9a0ff);background:linear-gradient(90deg,#8fb2ff,#c9a0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
@-webkit-keyframes blink{0%,100%{opacity:1;}50%{opacity:.28;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.28;}}
.okWrap{padding:14px 0 6px;}
.okSvg{width:76px;height:76px;display:block;margin:0 auto 14px;}
.okCircle{stroke:#3ddc97;stroke-width:2.6;stroke-dasharray:146;stroke-dashoffset:146;-webkit-animation:draw .65s ease forwards;animation:draw .65s ease forwards;}
.okCheck{stroke:#3ddc97;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:42;stroke-dashoffset:42;-webkit-animation:draw .38s .58s ease forwards;animation:draw .38s .58s ease forwards;}
@-webkit-keyframes draw{to{stroke-dashoffset:0;}}
@keyframes draw{to{stroke-dashoffset:0;}}
.okTitle{font-size:18px;font-weight:700;letter-spacing:2.5px;color:#5ee9b5;background:-webkit-linear-gradient(left,#3ddc97,#8fb2ff);background:linear-gradient(90deg,#3ddc97,#8fb2ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.okSub{margin-top:10px;font-size:12.5px;color:#7f8db0;letter-spacing:1px;}
@media (max-height:600px){.card{padding:26px 22px 16px;border-radius:20px;}.lockWrap{width:54px;height:54px;margin-bottom:14px;}.llhMonogram{font-size:12.5px;}.title{font-size:18px;}.field{margin-top:18px;}.badge{margin-top:16px;padding-top:12px;}}
</style>
</head>
<body>

<div class="bg">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="vignette"></div>
</div>

<div class="wrap">
  <div class="shakeBox" id="shakeBox">
    <div class="card" id="card">
      <div class="cornerMark">LLH</div>
      <div class="lockWrap"><span class="llhMonogram">LLH</span></div>
      <div class="title">LLH 加密保护</div>
      <div class="sub">此页面由 LLH 加密引擎保护<br>请输入访问密钥解密查看</div>
      <div class="field" id="field">
        <input id="pwd" type="password" placeholder="请输入访问密钥"
               autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false">
      </div>
      <div class="msg" id="msg"></div>
      <button class="btn" id="btn" type="button">解 密 访 问</button>
      <div class="badge"><i class="dot"></i>页面由 <b>LLH</b> 加密技术验证</div>
    </div>
  </div>
</div>
